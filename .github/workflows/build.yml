
name: Build Atelier TV Launcher APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV Launcher
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-29" "build-tools;29.0.3"
          yes | sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.6.3'

      - name: Build APK
        run: gradle assembleDebug

      - name: Validate APK
        run: |
          python3 scripts/validate_apk.py app/build/outputs/apk/debug/app-debug.apk

      - name: Calculate APK details
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: atelier-tv-launcher-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
