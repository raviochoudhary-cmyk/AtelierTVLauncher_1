name: Build Atelier TV Launcher APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      APK_PATH: app/build/outputs/apk/debug/app-debug.apk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          set -euo pipefail
          for f in settings.gradle build.gradle app/build.gradle gradle.properties \
                   app/src/main/AndroidManifest.xml \
                   app/src/main/java/com/atelier/tvlauncher/MainActivity.java \
                   app/src/main/java/com/atelier/tvlauncher/AppDiscovery.java \
                   app/src/main/java/com/atelier/tvlauncher/HdmiInputHelper.java \
                   scripts/validate_apk.py; do
            if [ ! -s "$f" ]; then echo "::error::Missing or empty: $f"; exit 1; fi
            echo "found $f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Uses the Android SDK and command-line tools pre-installed on the
      # GitHub-hosted Ubuntu runner (cmdline-tools/latest/bin/sdkmanager).
      # No third-party setup action, and no obsolete 'tools' package.
      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found at $SDKMANAGER"; exit 1
          fi
          echo "sdk.dir=$SDK" > local.properties
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null
          # build-tools;30.0.3 is the minimum build-tools version Android Gradle
          # Plugin 7.4.2 accepts. Without it AGP ignores 29.0.3 and downloads
          # 30.0.3 mid-build anyway; installing it here keeps the build reproducible.
          "$SDKMANAGER" --sdk_root="$SDK" \
            "platform-tools" \
            "platforms;android-29" \
            "build-tools;29.0.3" \
            "build-tools;30.0.3"
          "$SDKMANAGER" --sdk_root="$SDK" --list_installed

      - name: Set up Gradle 7.6.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.3"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK exists and is non-empty
        run: |
          set -euo pipefail
          if [ ! -s "$APK_PATH" ]; then
            echo "::error::APK missing or empty at $APK_PATH"; exit 1
          fi
          ls -l "$APK_PATH"

      - name: Validate APK contents
        run: python3 scripts/validate_apk.py "$APK_PATH"

      - name: Build summary
        if: always()
        run: |
          {
            echo "## Atelier TV Launcher APK"
            if [ -s "$APK_PATH" ]; then
              BYTES=$(stat -c %s "$APK_PATH")
              echo "- Size: ${BYTES} bytes ($(numfmt --to=iec --suffix=B "$BYTES"))"
              echo "- SHA-256: \`$(sha256sum "$APK_PATH" | cut -d' ' -f1)\`"
              echo "- Artifact: \`atelier-tv-launcher-apk\` → \`app-debug.apk\`"
              echo ""
              echo '```'
              unzip -l "$APK_PATH" | head -40
              echo '```'
            else
              echo "- **No APK produced.** See the failed step above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: atelier-tv-launcher-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
